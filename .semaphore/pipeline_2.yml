version: v1.0
name: Green version
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
blocks:
  - name: "\U0001F680 Kubernetes"
    task:
      jobs:
        - name: Green
          commands:
            - checkout
            - cd 2-blue-green-deployment
            - kubectl config set-context --current --namespace=g4
            - kubectl apply -f deployment-green.yml
            - kubectl apply -f service-green.yml
            - kubectl rollout status deployment/flask-app-green
            - kubectl get svc flask-app
      secrets:
        - name: kubeconfig
