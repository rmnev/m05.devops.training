version: v1.0
name: Pipeline 2
agent:
  machine:
    type: ''
    os_image: ''
blocks:
  - name: "\U0001F680 Kubernetes"
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: Canary
          commands:
            - checkout
            - cd 3-canary-deployment
            - kubectl config set-context --current --namespace=g4
            - kubectl apply -f deployment-stable.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app-stable
            - kubectl get svc flask-app
