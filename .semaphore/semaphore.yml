version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Docker"
    dependencies: []
    task:
      jobs:
        - name: Create and push
          commands:
            - checkout
            - cd 1-deployment
            - 'docker build -t rmnev/my-flask-image:latest .'
            - echo $DOCKER_TOKEN
            - docker login -u rmnev -p $DOCKER_TOKEN
            - 'docker push rmnev/my-flask-image:latest'
      secrets:
        - name: DOCKER_TOKEN_Mnev
  - name: "\U0001F680 Kubernetes"
    dependencies:
      - "\U0001F9EA Docker"
    task:
      jobs:
        - name: Canary
          commands:
            - checkout
            - cd 3-canary-deployment
            - kubectl config set-context --current --namespace=g4
            - kubectl apply -f deployment-canary.yml
            - kubectl apply -f service.yml
            - kubectl delete rs -l app=flask-app-canary --ignore-not-found --cascade=orphan
            - kubectl rollout status deployment/flask-app-canary
            - kubectl get svc flask-app
      secrets:
        - name: kubeconfig
