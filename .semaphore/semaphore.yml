version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Docker"
    dependencies: []
    task:
      jobs:
        - name: Build and push
          commands:
            - checkout
            - cd 1-deployment
            - 'docker build -t rmnev/my-flask-image:latest .'
            - echo $DOCKER_TOKEN
            - docker login -u rmnev -p $DOCKER_TOKEN
            - 'docker push rmnev/my-flask-image:latest'
      secrets:
        - name: DOCKER_TOKEN_Mnev
  - name: "\U0001F680 Kubernetes"
    dependencies:
      - "\U0001F9EA Docker"
    task:
      jobs:
        - name: Deploy
          commands:
            - checkout
            - cd 1-deployment
            - mkdir -p ~/.kube
            - 'wget https://gist.githubusercontent.com/TomFern/c6121c6d7fd72faeb5b7cf0ce5a0e002/raw/9e86a4ca3ac8c8df6aa34cc661f1410711aef8bd/config -O ~/.kube/config'
            - kubectl config set-context --current --namespace=g4
            - kubectl apply -f deployment.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app
            - kubectl get svc flask-app
  - name: Blue
    dependencies:
      - "\U0001F680 Kubernetes"
    task:
      secrets:
        - name: kubeconfig
      jobs:
        - name: Deploy Blue
          commands:
            - checkout
            - cd 2-blue-green-deployment
            - mkdir -p ~/.kube
            - 'wget https://gist.githubusercontent.com/TomFern/c6121c6d7fd72faeb5b7cf0ce5a0e002/raw/9e86a4ca3ac8c8df6aa34cc661f1410711aef8bd/config -O ~/.kube/config'
            - kubectl config set-context --current --namespace=g4
            - kubectl apply -f deployment-blue.yml
            - kubectl apply -f service-blue.yml
            - kubectl rollout status deployment/flask-app-blue
            - kubectl get svc flask-app
