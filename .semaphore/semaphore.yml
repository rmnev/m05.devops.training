version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Test"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - checkout
            - cd 1-deployment
            - 'docker build -t rmnev/my-flask-image:latest .'
            - echo $DOCKER_TOKEN_Mnev
            - docker login -u rmnev -p $DOCKER_TOKEN_Mnev
            - 'docker push rmnev/my-flask-image:latest'
      secrets:
        - name: DOCKER_TOKEN_Mnev
  - name: "\U0001F680 Deploy"
    dependencies:
      - "\U0001F9EA Test"
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - echo "Building application..."
            - echo "Running security checks..."
            - echo "Deploying to production..."
            - echo "Deployment completed successfully!"
